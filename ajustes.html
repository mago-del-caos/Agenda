<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ajustes - Ag lucem</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="stylesheet" href="/Agenda/styles.css">
    <link rel="manifest" href="/Agenda/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/Agenda/icon-192.png">
</head>
<body>

    <header class="app-header">
        <img src="/Agenda/Ag.png" alt="Ag lucem" class="header-image">
    </header>

    <nav class="app-nav">
        <a href="/Agenda/novedades.html" class="nav-btn">Novedades</a>
        <a href="/Agenda/horario.html" class="nav-btn">Horario</a>
        <a href="https://mago-del-caos.github.io/calendarioIJEM/" class="nav-btn">Calendario</a>
        <a href="https://mago-del-caos.github.io/Ju-bits/" class="nav-btn" style="display:none">Ju-bits</a>
        <a href="/Agenda/agenda.html" class="nav-btn">Agenda</a>
        <a href="/Agenda/herramientas.html" class="nav-btn">Herramientas</a>
        <a href="/Agenda/comunicacion.html" class="nav-btn">Comunicación</a>
        <a href="/Agenda/redes.html" class="nav-btn">Redes</a>
        <a href="/Agenda/ajustes.html" class="nav-btn active">Ajustes</a>
    </nav>

    <main class="app-main">
        <h2 class="section-title">Personalización de la App</h2>
        
        <div class="card-elevation" style="padding: 25px; margin-bottom: 20px;">
            
            <!-- Índice Cromático -->
            <div class="input-group">
                <label for="colorApp">🎨 Índice Cromático (Color Principal):</label>
                <input type="color" id="colorApp" value="#032A60" style="height: 60px; padding: 5px; cursor: pointer; border-radius: 12px;">
            </div>

            <!-- Estilo de Letra -->
            <div class="input-group">
                <label for="fuenteApp">🔤 Estilo de Letra (Tipografía):</label>
                <select id="fuenteApp">
                    <option value="'Segoe UI', sans-serif">Predeterminada (Moderna)</option>
                    <option value="'Times New Roman', serif">Clásica (Serif)</option>
                    <option value="'Courier New', monospace">Máquina de escribir</option>
                    <option value="'Comic Sans MS', cursive">Divertida (Infantil)</option>
                    <option value="Arial, sans-serif">Limpia (Arial)</option>
                </select>
            </div>
            
            <!-- Modo Nocturno -->
            <div class="input-group" style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--borde); padding-top: 20px;">
                <label for="modoOscuro" style="margin: 0; font-size: 1.1rem;">🌙 Activar Modo Nocturno</label>
                <input type="checkbox" id="modoOscuro" style="width: 25px; height: 25px; accent-color: var(--ij-azul-fuerte);">
            </div>

        </div>


        <h2 class="section-title">Mi cuenta</h2>

        <div class="card-elevation" style="padding: 25px; margin-bottom: 20px;">
            <!-- Foto de perfil -->
            <div class="input-group" style="display:flex; align-items:center; gap:16px;">
                <img id="miFotoVista" alt="Tu foto de perfil" style="width:72px; height:72px; border-radius:50%; object-fit:cover; border:3px solid var(--ij-amarillo, #FFD100); background:#e2e8f0;">
                <div>
                    <label for="miFoto" style="display:block; margin-bottom:8px;">🖼️ Foto de perfil:</label>
                    <input type="file" id="miFoto" accept="image/*" style="max-width:230px;">
                </div>
            </div>
            <button id="btnSubirFoto" class="app-btn btn-blue" style="width:100%; margin-bottom:8px;">Guardar foto</button>
            <p id="msgFoto" style="min-height:1.2em; font-size:.9rem; margin:4px 0 18px;"></p>

            <!-- Apodo en La red -->
            <div class="input-group">
                <label for="miApodo">🏷️ Tu apodo en La red:</label>
                <input type="text" id="miApodo" maxlength="8" placeholder="Máximo 8 caracteres" autocomplete="off">
                <p style="font-size:.82rem; color:#64748b; margin:6px 0 0;">Es el único nombre que verán los demás en La red; tu nombre completo nunca se muestra ahí. Sin groserías ni dobles sentidos.</p>
            </div>
            <button id="btnGuardarApodo" class="app-btn btn-blue" style="width:100%; margin-bottom:8px;">Guardar apodo</button>
            <p id="msgApodo" style="min-height:1.2em; font-size:.9rem; margin:4px 0 18px;"></p>

            <!-- Cambio de contraseña -->
            <div class="input-group">
                <label for="miPassActual">🔑 Contraseña actual:</label>
                <input type="password" id="miPassActual" autocomplete="current-password">
            </div>
            <div class="input-group">
                <label for="miPassNueva">Nueva contraseña:</label>
                <input type="password" id="miPassNueva" autocomplete="new-password">
            </div>
            <button id="btnCambiarPass" class="app-btn btn-blue" style="width:100%;">Cambiar mi contraseña</button>
            <p id="msgPass" style="min-height:1.2em; font-size:.9rem; margin:4px 0 0;"></p>
        </div>

        <!-- Botón de Actualización Forzada -->
        <button id="btnActualizarApp" class="app-btn btn-blue" style="width: 100%; margin-bottom: 15px; flex-direction: row; gap: 10px;">
            🔄 Forzar Actualización del Sistema
        </button>

        <!-- Barra de Progreso de 10 Segundos (Oculta por defecto) -->
        <div id="updateProgressContainer" class="hidden" style="margin-bottom: 15px; width: 100%; background: var(--borde); border-radius: 10px; overflow: hidden; height: 35px; position: relative; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);">
            <div id="updateProgressBar" style="width: 0%; height: 100%; background: linear-gradient(135deg, #00A8FF, #032A60); transition: width 0.1s linear;"></div>
            <span id="updateProgressText" style="position: absolute; top: 0; left: 0; width: 100%; text-align: center; line-height: 35px; font-weight: bold; color: #FFFFFF; text-shadow: 1px 1px 3px rgba(0,0,0,0.6); font-size: 0.9rem;">0%</span>
        </div>

        <!-- Botón de Cerrar Sesión -->
        <button id="btnCerrarSesion" class="app-btn btn-magenta" style="width: 100%; flex-direction: row; gap: 10px;">
            🚪 Cerrar Sesión Segura
        </button>

    </main>

    <script src="/Agenda/script.js"></script>

    <script>
        (function () {
            var API = "https://aglucem-api.adrian-camelot32.workers.dev";
            var token = localStorage.getItem("aglucem_token");
            var user = JSON.parse(localStorage.getItem("aglucem_user") || "null");
            var vista = document.getElementById("miFotoVista");
            if (user && user.foto) vista.src = user.foto;
            var campoApodo = document.getElementById("miApodo");
            if (user && user.apodo) campoApodo.value = user.apodo;
            fetch(API + "/auth/me", { headers: { Authorization: "Bearer " + token } })
                .then(function (r) { return r.json(); })
                .then(function (u) {
                    if (u.foto) vista.src = u.foto;
                    if (u.apodo && !campoApodo.value) campoApodo.value = u.apodo;
                    localStorage.setItem("aglucem_user", JSON.stringify(u));
                })
                .catch(function () {});

            document.getElementById("btnGuardarApodo").addEventListener("click", function () {
                var apodo = campoApodo.value.trim();
                if (!apodo) { nota("msgApodo", "Escribe un apodo.", false); return; }
                fetch(API + "/auth/apodo", {
                    method: "POST",
                    headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
                    body: JSON.stringify({ apodo: apodo })
                })
                    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
                    .then(function (res) {
                        if (!res.ok) { nota("msgApodo", res.d.error || "No se pudo guardar.", false); return; }
                        var u2 = JSON.parse(localStorage.getItem("aglucem_user") || "{}");
                        u2.apodo = res.d.apodo;
                        localStorage.setItem("aglucem_user", JSON.stringify(u2));
                        nota("msgApodo", "Apodo guardado: así te verán en La red.", true);
                    })
                    .catch(function () { nota("msgApodo", "Sin conexión con el servidor.", false); });
            });

            function nota(id, texto, ok) {
                var el = document.getElementById(id);
                el.textContent = texto;
                el.style.color = ok ? "#15803d" : "#b91c1c";
            }

            document.getElementById("btnSubirFoto").addEventListener("click", function () {
                var archivo = document.getElementById("miFoto").files[0];
                if (!archivo) { nota("msgFoto", "Primero elige una imagen.", false); return; }
                var lector = new FileReader();
                lector.onload = function () {
                    var img = new Image();
                    img.onload = function () {
                        var lado = 256;
                        var lienzo = document.createElement("canvas");
                        lienzo.width = lado; lienzo.height = lado;
                        var ctx = lienzo.getContext("2d");
                        var escala = Math.max(lado / img.width, lado / img.height);
                        var w = img.width * escala, h = img.height * escala;
                        ctx.drawImage(img, (lado - w) / 2, (lado - h) / 2, w, h);
                        var datos = lienzo.toDataURL("image/jpeg", 0.85);
                        fetch(API + "/auth/foto", {
                            method: "POST",
                            headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
                            body: JSON.stringify({ foto: datos })
                        }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
                          .then(function (x) {
                              if (!x.ok) { nota("msgFoto", x.d.error || "No se pudo guardar.", false); return; }
                              vista.src = datos;
                              if (user) { user.foto = datos; localStorage.setItem("aglucem_user", JSON.stringify(user)); }
                              nota("msgFoto", "Foto guardada. Se verá junto a tu nombre en toda la Agenda.", true);
                          }).catch(function () { nota("msgFoto", "Error de red al guardar la foto.", false); });
                    };
                    img.src = lector.result;
                };
                lector.readAsDataURL(archivo);
            });

            document.getElementById("btnCambiarPass").addEventListener("click", function () {
                var datos = {
                    actual: document.getElementById("miPassActual").value,
                    nueva: document.getElementById("miPassNueva").value
                };
                fetch(API + "/auth/password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
                    body: JSON.stringify(datos)
                }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
                  .then(function (x) {
                      if (!x.ok) { nota("msgPass", x.d.error || "No se pudo cambiar.", false); return; }
                      nota("msgPass", "Contraseña actualizada. Es tuya: ni el administrador la conoce.", true);
                      document.getElementById("miPassActual").value = "";
                      document.getElementById("miPassNueva").value = "";
                  }).catch(function () { nota("msgPass", "Error de red al cambiar la contraseña.", false); });
            });
        })();
    </script>
</body>
</html>
