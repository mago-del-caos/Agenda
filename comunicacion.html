<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comunicación - Ag lucem</title>
    
    <!-- Destructores de caché -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="/Agenda/styles.css">
    <link rel="manifest" href="/Agenda/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ag lucem">
    <link rel="apple-touch-icon" href="/Agenda/icon-192.png">

    <style>
        /* Contenedor estricto para forzar la simetría de todas las imágenes */
        .icon-wrapper {
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        /* La imagen se adaptará al contenedor sin deformarse */
        .img-icon {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0px 6px 6px rgba(0,0,0,0.3));
        }

        /* Forzar que todos los botones tengan la misma altura para alinear el texto */
        .app-btn {
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .btn-green { background: linear-gradient(135deg, #00C65A, var(--ij-verde, #009944)); color: #FFFFFF !important; }
        .btn-yellow { background: linear-gradient(135deg, #FFE047, var(--ij-amarillo, #FFD100)); color: #1E293B !important; }
    </style>
</head>
<body>
    <header class="app-header">
        <img src="/Agenda/Ag.png" alt="Ag lucem" class="header-image">
    </header>

    <nav class="app-nav">
        <a href="/Agenda/novedades.html" class="nav-btn">Novedades</a>
        <a href="/Agenda/horario.html" class="nav-btn">Horario</a>
        <a href="/Agenda/agenda.html" class="nav-btn">Agenda</a>
        <a href="/Agenda/herramientas.html" class="nav-btn">Herramientas</a>
        <a href="/Agenda/comunicacion.html" class="nav-btn active">Comunicación</a>
        <a href="/Agenda/redes.html" class="nav-btn">Redes</a>
        <a href="/Agenda/ajustes.html" class="nav-btn">Ajustes</a>
    </nav>

    <main class="app-main">
        <h2 class="section-title">Canales Oficiales</h2>
        
        <div class="button-grid">
            
            <!-- 1. Lu Mon (NUEVO BOTÓN) -->
            <a href="https://proyecto-aracknia.neocities.org/cafe" target="_blank" class="app-btn btn-blue">
                <div class="icon-wrapper">
                    <img src="cafe.png" alt="Icono Lu Mon" class="img-icon">
                </div>
                Lu Mon
            </a>

            <!-- 2. DIE -->
            <a href="https://departamentoinnovacioneducativa-del.github.io/DIE2/index.html" target="_blank" class="app-btn btn-blue">
                <div class="icon-wrapper">
                    <img src="/Agenda/DIE.png" alt="Símbolo DIE" class="img-icon">
                </div>
                DIE
            </a>

            <!-- 3. IJEM -->
            <a href="https://juventud.edu.mx/" target="_blank" class="app-btn btn-green">
                <div class="icon-wrapper">
                    <img src="/Agenda/IJEM.png" alt="Símbolo IJEM" class="img-icon">
                </div>
                IJEM
            </a>

            <!-- 4. Padlet -->
            <a href="https://padlet.com/" target="_blank" class="app-btn btn-magenta">
                <div class="icon-wrapper">
                    <img src="/Agenda/padlet.png" alt="Icono Padlet" class="img-icon">
                </div>
                Padlet
            </a>

            <!-- 5. Global School -->
            <a href="https://ln.globalschool.mx/gs/gslearn/frm_login" target="_blank" class="app-btn btn-yellow">
                <div class="icon-wrapper">
                    <img src="/Agenda/global.png" alt="Icono Global School" class="img-icon">
                </div>
                Global School
            </a>

            <!-- 6. Google Classroom -->
            <a href="https://classroom.google.com/" target="_blank" class="app-btn btn-blue">
                <div class="icon-wrapper">
                    <img src="/Agenda/classroom.png" alt="Icono Classroom" class="img-icon">
                </div>
                Classroom
            </a>

        </div>
    </main>

    <script src="/Agenda/script.js"></script>
</body>
</html>
