    <link rel="stylesheet" href="/Agenda/styles.css">

    <style>
        /* Encabezado de contexto de canales — misma identidad que la hero-card de Ag lucem:
           tarjeta clara, franja superior azul→celeste→amarillo→verde y píldora celeste */
        .comm-header-card {
            background: linear-gradient(180deg, #FFFFFF 0%, #F9FBFF 100%);
            color: var(--texto-oscuro, #1E293B);
            border-radius: 22px;
            padding: 18px 20px 16px;
            margin-bottom: 18px;
            border: 1px solid rgba(3, 42, 96, 0.1);
            box-shadow: 0 10px 28px rgba(3, 42, 96, 0.07);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            position: relative;
            overflow: hidden;
        }

        .comm-header-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--ij-azul-fuerte, #032A60), var(--ij-celeste, #00A8FF), var(--ij-amarillo, #FFD100), var(--ij-verde, #009944));
        }

        .comm-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--ij-azul-fuerte, #032A60);
            background: rgba(0, 168, 255, 0.12);
            border: 1px solid rgba(0, 168, 255, 0.25);
            padding: 5px 12px;
            border-radius: 999px;
        }

        .comm-count {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--texto-claro, #64748B);
        }

        /* Cuadrícula adaptable a móvil, tablet y escritorio */
        .comm-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding-bottom: 36px;
        }

        @media (min-width: 640px) {
            .comm-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 16px;
            }
        }

        /* Tarjetas con alta visibilidad y contraste */
        .comm-card {
            min-height: 168px;
            padding: 18px 12px;
            border-radius: 20px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            transition: transform 0.18s ease, box-shadow 0.22s ease, filter 0.2s ease;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.14);
        }

        .comm-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.14) 0%, rgba(0, 0, 0, 0.12) 100%);
            pointer-events: none;
        }

        .comm-card:hover {
            transform: translateY(-3px);
            filter: brightness(1.04);
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.22);
        }

        .comm-card:active {
            transform: scale(0.97);
        }

        .icon-wrapper {
            width: 84px;
            height: 84px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.94);
            padding: 8px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
        }

        .img-icon {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .calendar-emoji-icon {
            font-size: 2.5rem;
            line-height: 1;
        }

        .comm-label {
            position: relative;
            z-index: 1;
            font-size: 0.98rem;
            font-weight: 800;
            letter-spacing: 0.2px;
            line-height: 1.2;
            padding: 4px 10px;
            border-radius: 999px;
        }

        /* Variantes cromáticas con alto contraste */
        .card-blue {
            background: linear-gradient(135deg, var(--ij-celeste, #00A8FF) 0%, var(--ij-azul-fuerte, #032A60) 100%);
            color: #FFFFFF;
        }

        .card-blue .comm-label {
            background: rgba(3, 20, 46, 0.42);
            color: #FFFFFF;
        }

        .card-green {
            background: linear-gradient(135deg, #00C65A 0%, var(--ij-verde, #009944) 100%);
            color: #FFFFFF;
        }

        .card-green .comm-label {
            background: rgba(0, 48, 22, 0.42);
            color: #FFFFFF;
        }

        .card-magenta {
            background: linear-gradient(135deg, #FF4D79 0%, var(--ij-magenta, #D31A52) 100%);
            color: #FFFFFF;
        }

        .card-magenta .comm-label {
            background: rgba(56, 5, 21, 0.42);
            color: #FFFFFF;
        }

        .card-yellow {
            background: linear-gradient(135deg, #FFE047 0%, var(--ij-amarillo, #FFD100) 100%);
            color: #0F172A;
        }

        .card-yellow .comm-label {
            background: rgba(255, 255, 255, 0.72);
            color: #0F172A;
        }
    </style>
</head>
