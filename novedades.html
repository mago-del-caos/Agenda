<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Novedades - Ag lucem</title>
    
    <!-- Destructores de caché -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="/Agenda/styles.css">
    <link rel="manifest" href="/Agenda/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ag lucem">
    <link rel="apple-touch-icon" href="/Agenda/icon-192.png">

    <style>
        /* Sistema de Carrusel Táctil Uno a Uno */
        .carrusel-contenedor {
            width: 100%;
            margin: 0 auto 20px auto;
            position: relative;
        }
        .carrusel {
            display: flex;
            overflow-x: auto;
            /* El secreto del deslizamiento perfecto */
            scroll-snap-type: x mandatory;
            scrollbar-width: none; /* Oculta la barra en Firefox */
            -ms-overflow-style: none; /* Oculta la barra en IE y Edge */
            gap: 15px; /* Separación entre imágenes */
            padding-bottom: 5px;
        }
        .carrusel::-webkit-scrollbar {
            display: none; /* Oculta la barra en Chrome, Safari, Opera */
        }
        .slide {
            /* flex: 0 0 100% obliga a que cada imagen ocupe exactamente toda la pantalla del celular */
            flex: 0 0 100%; 
            scroll-snap-align: center; /* Engancha la imagen al centro */
            aspect-ratio: 1 / 1; /* FORZA EL FORMATO CUADRADO PERFECTO */
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            background-color: var(--fondo-app, #f8f9fa);
            position: relative;
        }
        .slide img {
            width: 100%;
            height: 100%;
            /* 'cover' llena el cuadrado perfecto. Si tus imágenes originales no son muy cuadradas y ves que recorta información importante, cambia la palabra 'cover' por 'contain' */
            object-fit: cover; 
        }
        .indicador-deslizamiento {
            text-align: center;
            font-size: 0.95rem;
            color: var(--texto-claro);
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header class="app-header">
        <img src="/Agenda/Ag.png" alt="Ag lucem" class="header-image">
    </header>

    <nav class="app-nav">
        <!-- Novedades activo -->
        <a href="/Agenda/novedades.html" class="nav-btn active">Novedades</a>
        <a href="/Agenda/horario.html" class="nav-btn">Horario</a>
        <a href="/Agenda/agenda.html" class="nav-btn">Agenda</a>
        <a href="/Agenda/herramientas.html" class="nav-btn">Herramientas</a>
        <a href="/Agenda/comunicacion.html" class="nav-btn">Comunicación</a>
        <a href="/Agenda/redes.html" class="nav-btn">Redes</a>
        <a href="/Agenda/ajustes.html" class="nav-btn">Ajustes</a>
    </nav>

    <main class="app-main">
        <!-- El saludo personalizado lo inyecta el script.js aquí -->
        <h2 id="tituloNovedades" class="section-title" style="margin-bottom: 25px; color: var(--ij-azul-fuerte);">Hola, mira las novedades de hoy</h2>
        
        <div class="carrusel-contenedor">
            <div class="carrusel">
                <div class="slide"><img src="/Agenda/1.png" alt="Novedad 1"></div>
                <div class="slide"><img src="/Agenda/2.png" alt="Novedad 2"></div>
                <div class="slide"><img src="/Agenda/3.png" alt="Novedad 3"></div>
                <div class="slide"><img src="/Agenda/4.png" alt="Novedad 4"></div>
                <div class="slide"><img src="/Agenda/5.png" alt="Novedad 5"></div>
            </div>
            
            <div class="indicador-deslizamiento">
                <span>⬅️</span>
                <span>Desliza para ver más</span>
                <span>➡️</span>
            </div>
        </div>
        
    </main>

    <script src="/Agenda/script.js"></script>
</body>
</html>
