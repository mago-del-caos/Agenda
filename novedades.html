<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Novedades - Ag lucem</title>
    
    <!-- Destructores de caché -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="/Agenda/styles.css">
    <link rel="manifest" href="/Agenda/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ag lucem">
    <link rel="apple-touch-icon" href="/Agenda/icon-192.png">

    <style>
        /* Contenedor estricto para la ventana de Neocities */
        .iframe-container {
            width: 100%;
            aspect-ratio: 1 / 1; /* Mantiene el cuadrado perfecto para celulares */
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            margin-bottom: 15px;
            background-color: var(--fondo-app, #f8f9fa);
            position: relative;
        }

        /* Ajuste del Iframe para que parezca nativo */
        .carrete-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <header class="app-header">
        <img src="/Agenda/Ag.png" alt="Ag lucem" class="header-image">
    </header>

    <nav class="app-nav">
        <!-- Novedades activo -->
        <a href="/Agenda/novedades.html" class="nav-btn active">Novedades</a>
        <a href="/Agenda/horario.html" class="nav-btn">Horario</a>
        <a href="/Agenda/agenda.html" class="nav-btn">Agenda</a>
        <a href="/Agenda/herramientas.html" class="nav-btn">Herramientas</a>
        <a href="/Agenda/comunicacion.html" class="nav-btn">Comunicación</a>
        <a href="/Agenda/redes.html" class="nav-btn">Redes</a>
        <a href="/Agenda/ajustes.html" class="nav-btn">Ajustes</a>
    </nav>

    <main class="app-main">
        <!-- El saludo personalizado lo inyecta el script.js aquí -->
        <h2 id="tituloNovedades" class="section-title" style="margin-bottom: 25px; color: var(--ij-azul-fuerte);">Hola, mira las novedades de hoy</h2>
        
        <!-- Ventana conectada en tiempo real a Neocities -->
        <div class="iframe-container">
            <iframe src="https://proyecto-aracknia.neocities.org/carrete" class="carrete-iframe" title="Carrete de Novedades" allowfullscreen></iframe>
        </div>
        
    </main>

    <script src="/Agenda/script.js"></script>
</body>
</html>
