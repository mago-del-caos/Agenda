<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sociograma</title>
    <!-- Tailwind CSS for rapid styling and responsiveness -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sky-blue': '#87CEEB',
                    }
                }
            }
        }
    </script>
    <style>
        /* Ensuring smooth transitions for hover effects */
        .hover-lift {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .hover-lift:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-sky-blue min-h-screen flex flex-col items-center font-sans antialiased p-4 sm:p-6 lg:p-10">

    <!-- Header Section -->
    <header class="w-full max-w-4xl mb-10 text-center">
        <!-- Main Header Image -->
        <img 
            src="sociograma.jpeg" 
            alt="Sociograma Principal" 
            class="w-full h-auto rounded-2xl shadow-lg border-4 border-white/40 object-cover"
            onerror="this.onerror=null; this.src='https://placehold.co/1200x400/2563eb/ffffff?text=Imagen+Principal+(sociograma.jpeg)';"
        />
    </header>

    <!-- Main Content Section (Buttons) -->
    <main class="w-full max-w-5xl">
        <!-- Grid layout: 1 column on mobile, 3 columns on desktop -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <!-- Link/Button 1 -->
            <a 
                href="https://docs.google.com/forms/d/e/1FAIpQLScjok3gYm68cfs5GF38V55v89zR_tz6mV_t-YheGsKeIcNgHA/viewform?usp=sharing&ouid=110785368421537292293" 
                target="_blank" 
                rel="noopener noreferrer"
                class="hover-lift block rounded-2xl overflow-hidden shadow-md bg-white/20 backdrop-blur-sm border-2 border-white/30"
                aria-label="Enlace a formulario de Sociograma 4"
            >
                <img 
                    src="sociograma4.jpeg" 
                    alt="Sociograma 4" 
                    class="w-full h-auto object-cover"
                    onerror="this.onerror=null; this.src='https://placehold.co/600x600/3b82f6/ffffff?text=Botón+1+(sociograma4.jpeg)';"
                />
            </a>

            <!-- Link/Button 2 -->
            <a 
                href="https://docs.google.com/forms/d/e/1FAIpQLSeFT7KhteAbjiD9vX_qpp66vMkn9KBgPdLMC5nY_7xS1upwsg/viewform?usp=sharing&ouid=110785368421537292293" 
                target="_blank" 
                rel="noopener noreferrer"
                class="hover-lift block rounded-2xl overflow-hidden shadow-md bg-white/20 backdrop-blur-sm border-2 border-white/30"
                aria-label="Enlace a formulario de Sociograma 5"
            >
                <img 
                    src="sociograma5.jpeg" 
                    alt="Sociograma 5" 
                    class="w-full h-auto object-cover"
                    onerror="this.onerror=null; this.src='https://placehold.co/600x600/1d4ed8/ffffff?text=Botón+2+(sociograma5.jpeg)';"
                />
            </a>

            <!-- Link/Button 3 -->
            <a 
                href="https://docs.google.com/forms/d/e/1FAIpQLScNzt-lXic5uSmL1AY4GNtoDlsgXCsqVqOKqD7a9IMmeFStBQ/viewform?usp=sharing" 
                target="_blank" 
                rel="noopener noreferrer"
                class="hover-lift block rounded-2xl overflow-hidden shadow-md bg-white/20 backdrop-blur-sm border-2 border-white/30"
                aria-label="Enlace a formulario de Sociograma 6"
            >
                <img 
                    src="sociograma6.jpeg" 
                    alt="Sociograma 6" 
                    class="w-full h-auto object-cover"
                    onerror="this.onerror=null; this.src='https://placehold.co/600x600/1e40af/ffffff?text=Botón+3+(sociograma6.jpeg)';"
                />
            </a>

        </div>
    </main>

    <!-- Optional Footer -->
    <footer class="mt-16 text-white/70 text-sm text-center">
        <p>Selecciona una de las opciones anteriores para continuar.</p>
    </footer>

</body>
</html>
