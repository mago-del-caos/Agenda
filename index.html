<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso - Ag lucem</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="/Agenda/styles.css">
    <link rel="manifest" href="/Agenda/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ag lucem">
    <link rel="apple-touch-icon" href="/Agenda/icon-192.png">
</head>
<body class="login-body">

    <div class="login-container card-elevation">
        <img src="/Agenda/Ag.png" alt="Ag lucem" class="login-logo">
        <h2 class="section-title" style="text-align: center; font-size: 1.3rem;" id="loginTitle">Iniciar Sesión</h2>
        
        <form id="authForm">
            <!-- El nombre inicia oculto, solo sale si tocan "Crear nueva cuenta" -->
            <div class="input-group" id="nameGroup" style="display: none;">
                <label for="nameInput">¿Cómo te llamas? (Nombre o Apodo)</label>
                <input type="text" id="nameInput" placeholder="Ej. Juan Pérez">
            </div>

            <div class="input-group">
                <label for="emailInput">Correo Institucional</label>
                <input type="email" id="emailInput" placeholder="usuario@juventud.edu.mx" required>
            </div>
            <div class="input-group">
                <label for="passInput">Contraseña</label>
                <input type="password" id="passInput" placeholder="••••••••" required>
            </div>
            
            <p id="errorMessage" class="error-text"></p>
            
            <button type="submit" id="mainSubmitBtn" class="app-btn btn-blue" style="width: 100%; padding: 15px; border: none; cursor: pointer;">
                Ingresar
            </button>
        </form>

        <!-- Botón de cambio de modo centrado y arreglado -->
        <div style="text-align: center; margin-top: 20px;">
            <button type="button" id="toggleModeBtn" class="text-btn" style="display: inline-block; width: auto; margin: 0 auto;">Crear nueva cuenta (Registrarme)</button>
        </div>

        <div id="lockScreen" class="lock-screen hidden">
            <span class="lock-icon">🔒</span>
            <h3>Acceso Bloqueado</h3>
            <p>Has superado el límite de 3 intentos.</p>
            <p>Acude al <strong>Departamento de Innovación Educativa</strong> para actualizar tu contraseña.</p>
        </div>
    </div>

    <script src="/Agenda/script.js"></script>
</body>
</html>
