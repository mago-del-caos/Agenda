<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ag lucem - App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- App Bar Superior -->
<header class="app-bar">
    <img src="Ag.png" alt="Logotipo" class="header-logo">
</header>

<div class="app-container">

    <!-- Menús Desplegables (Estilo Android List) -->
    <div class="menu-list">
        <details class="menu-dropdown">
            <summary>Chemini</summary>
            <div class="dropdown-content">
                <a href="https://chemini.aracknia.com/" target="_blank">Abrir Chemini</a>
            </div>
        </details>

        <details class="menu-dropdown">
            <summary>Herramientas</summary>
            <div class="dropdown-content">
                <a href="https://departamentoinnovacioneducativa-del.github.io/CHEMA-edu-2.0/" target="_blank">Abrir Herramientas</a>
            </div>
        </details>

        <details class="menu-dropdown">
            <summary>IAs</summary>
            <div class="dropdown-content">
                <a href="https://departamentoinnovacioneducativa-del.github.io/Juventudrepositorio/" target="_blank">Abrir Repositorio IA</a>
            </div>
        </details>

        <details class="menu-dropdown">
            <summary>Classroom</summary>
            <div class="dropdown-content">
                <a href="https://classroom.google.com/" target="_blank">Abrir Google Classroom</a>
            </div>
        </details>

        <details class="menu-dropdown">
            <summary>Padlet</summary>
            <div class="dropdown-content">
                <a href="https://padlet.com/" target="_blank">Abrir Padlet</a>
            </div>
        </details>
    </div>

    <!-- Sección de Horario -->
    <h2 class="section-title">Horario</h2>
    <div class="table-responsive card-elevation">
        <table>
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Lun</th>
                    <th>Mar</th>
                    <th>Mié</th>
                    <th>Jue</th>
                    <th>Vie</th>
                </tr>
            </thead>
            <tbody id="horarioBody">
                <tr><td class="hora-col" contenteditable="true">07:00</td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
                <tr><td class="hora-col" contenteditable="true">09:00</td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
                <tr><td class="hora-col" contenteditable="true">11:00</td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
                <tr><td class="hora-col" contenteditable="true">13:00</td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
                <tr><td class="hora-col" contenteditable="true">15:00</td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td><td contenteditable="true"></td></tr>
            </tbody>
        </table>
    </div>

    <!-- Sección de Agenda Dinámica -->
    <h2 class="section-title">Agenda</h2>
    <div class="agenda-container card-elevation">
        <ul class="task-list" id="taskList">
            <!-- Las tareas se renderizan aquí mediante JavaScript -->
        </ul>
    </div>

</div>

<!-- Botón Flotante de Acción (FAB) estilo Android -->
<button class="fab-button" id="addTaskBtn" title="Añadir Tarea">+</button>

<script src="script.js"></script>
</body>
</html>
