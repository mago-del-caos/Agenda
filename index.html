<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso - Ag lucem</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="/Agenda/styles.css">
    <link rel="manifest" href="/Agenda/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ag lucem">
    <link rel="apple-touch-icon" href="/Agenda/icon-192.png">

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #032A60, #000F25);
            padding: 20px;
            margin: 0;
            font-family: var(--fuente-app, sans-serif);
        }
        .login-card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-logo { width: 120px; height: auto; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-label { display: block; margin-bottom: 8px; color: #1e293b; font-weight: bold; font-size: 0.95rem; }
        .standard-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background: #f8fafc;
            color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="/Agenda/Ag.png" alt="Ag lucem Logo" class="login-logo">
        <h2 style="color: #032A60; margin-top: 0; margin-bottom: 5px;">Bienvenido</h2>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 25px;">Ingresa tus credenciales institucionales</p>

        <div class="input-group">
            <label class="input-label" for="userEmail">Correo o Usuario</label>
            <input type="text" id="userEmail" class="standard-input" placeholder="usuario@juventud.edu.mx" onkeypress="verificarEnter(event)">
        </div>

        <div class="input-group">
            <label class="input-label" for="userPassword">Contraseña</label>
            <input type="password" id="userPassword" class="standard-input" placeholder="••••••••" onkeypress="verificarEnter(event)">
        </div>

        <button id="btnEntrar" onclick="procesarAcceso()" class="app-btn btn-blue" style="width: 100%; padding: 15px; font-size: 1.1rem; background: linear-gradient(135deg, #00A8FF, #032A60); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
            Entrar a la Agenda
        </button>
    </div>

    <script>
        // Si ya hay una sesión activa guardada, evita que aparezca el login y manda directo a novedades
        if (localStorage.getItem('app_isLoggedIn') === 'true') {
            window.location.replace("/Agenda/novedades.html");
        }

        function verificarEnter(event) { 
            if (event.key === "Enter") procesarAcceso(); 
        }

        function procesarAcceso() {
            const email = document.getElementById('userEmail').value.trim();
            const pass = document.getElementById('userPassword').value.trim();

            if (email === "" || pass === "") {
                alert("Por favor, ingresa tu usuario y contraseña.");
                return;
            }

            // Aquí posteriormente conectaremos con tu API en Node.js sobre Debian/Cloudflare.
            // Por ahora, guardamos el estado para que NUNCA vuelva a pedir credenciales en este dispositivo:
            localStorage.setItem('app_isLoggedIn', 'true');
            localStorage.setItem('app_currentUserEmail', email);

            // Salto definitivo a novedades
            window.location.replace("/Agenda/novedades.html");
        }
    </script>
</body>
</html>
