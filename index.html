<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso - Ag lucem</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="/Agenda/styles.css">
    <link rel="manifest" href="/Agenda/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ag lucem">
    <link rel="apple-touch-icon" href="/Agenda/icon-192.png">

    <style>
        /* Centrado de la pantalla de inicio */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            background-color: var(--fondo-app, #f0f4f8);
            padding: 20px;
        }
        .login-card {
            background: var(--blanco, #ffffff);
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-logo {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-label {
            display: block;
            margin-bottom: 8px;
            color: var(--texto-oscuro, #1e293b);
            font-weight: bold;
            font-size: 0.95rem;
        }
        /* El truco visual para el dominio bloqueado */
        .email-input-container {
            display: flex;
            align-items: center;
            border: 1px solid var(--borde, #cbd5e1);
            border-radius: 8px;
            overflow: hidden;
            background: var(--fondo-app, #f8fafc);
        }
        .email-input-container input {
            flex: 1;
            padding: 12px;
            border: none;
            outline: none;
            background: transparent;
            font-family: var(--fuente-app);
            font-size: 1rem;
            color: var(--texto-oscuro);
        }
        .email-domain {
            background: #e2e8f0;
            color: #475569;
            padding: 12px;
            font-weight: bold;
            border-left: 1px solid var(--borde, #cbd5e1);
            font-size: 0.9rem;
        }
        .standard-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--borde, #cbd5e1);
            border-radius: 8px;
            font-family: var(--fuente-app);
            font-size: 1rem;
            box-sizing: border-box;
            background: var(--fondo-app, #f8fafc);
            color: var(--texto-oscuro);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="/Agenda/Ag.png" alt="Ag lucem Logo" class="login-logo">
        <h2 style="color: var(--ij-azul-fuerte, #032A60); margin-top: 0; margin-bottom: 5px;">Bienvenido</h2>
        <p style="color: var(--texto-claro, #64748b); font-size: 0.9rem; margin-bottom: 25px;">Ingresa tus datos institucionales</p>

        <div class="input-group">
            <label class="input-label" for="userName">Nombre Completo</label>
            <input type="text" id="userName" class="standard-input" placeholder="Ej. Juan Pérez">
        </div>

        <div class="input-group">
            <label class="input-label" for="userEmailPrefix">Correo Institucional</label>
            <div class="email-input-container">
                <input type="text" id="userEmailPrefix" placeholder="tu.usuario">
                <span class="email-domain">@juventud.edu.mx</span>
            </div>
        </div>

        <button id="btnLogin" class="app-btn btn-blue" style="width: 100%; padding: 15px; font-size: 1.1rem; flex-direction: row; justify-content: center;">
            Entrar a la Agenda
        </button>
    </div>

    <script src="/Agenda/script.js"></script>
</body>
</html>
