<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acceso - Ag lucem</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="/Agenda/styles.css">
    <link rel="manifest" href="/Agenda/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ag lucem">
    <link rel="apple-touch-icon" href="/Agenda/icon-192.png">

    <style>
        /* Fondo Azul Marino Institucional */
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #032A60, #000F25);
            padding: 20px;
            margin: 0;
            font-family: var(--fuente-app, sans-serif);
        }
        .login-card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-logo {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .input-label {
            display: block;
            margin-bottom: 8px;
            color: #1e293b;
            font-weight: bold;
            font-size: 0.95rem;
        }
        /* El truco visual para el dominio bloqueado */
        .email-input-container {
            display: flex;
            align-items: center;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            background: #f8fafc;
        }
        .email-input-container input {
            flex: 1;
            padding: 12px;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1rem;
            color: #1e293b;
        }
        .email-domain {
            background: #e2e8f0;
            color: #475569;
            padding: 12px;
            font-weight: bold;
            border-left: 1px solid #cbd5e1;
            font-size: 0.9rem;
            pointer-events: none; /* Evita que el usuario borre el dominio */
        }
        .standard-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            background: #f8fafc;
            color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="/Agenda/Ag.png" alt="Ag lucem Logo" class="login-logo">
        <h2 style="color: #032A60; margin-top: 0; margin-bottom: 5px;">Bienvenido</h2>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 25px;">Ingresa tus datos institucionales</p>

        <div class="input-group">
            <label class="input-label" for="userName">Nombre Completo</label>
            <!-- Evento de teclado para aceptar la tecla ENTER -->
            <input type="text" id="userName" class="standard-input" placeholder="Ej. Juan Pérez" onkeypress="verificarEnter(event)">
        </div>

        <div class="input-group">
            <label class="input-label" for="userEmailPrefix">Correo Institucional</label>
            <div class="email-input-container">
                <input type="text" id="userEmailPrefix" placeholder="tu.usuario" onkeypress="verificarEnter(event)">
                <span class="email-domain">@juventud.edu.mx</span>
            </div>
        </div>

        <!-- ID cambiado a btnEntrarDirecto y función onclick aislada -->
        <button id="btnEntrarDirecto" onclick="procesarAcceso()" class="app-btn btn-blue" style="width: 100%; padding: 15px; font-size: 1.1rem; justify-content: center; background: linear-gradient(135deg, #00A8FF, #032A60); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
            Entrar a la Agenda
        </button>
    </div>

    <!-- SCRIPT DE ACCESO BLINDADO (Inmune a problemas de caché) -->
    <script>
        // Función para permitir entrar presionando Enter
        function verificarEnter(event) {
            if (event.key === "Enter") {
                procesarAcceso();
            }
        }

        // Motor principal de acceso independiente
        function procesarAcceso() {
            const inputNombre = document.getElementById('userName');
            const inputPrefijo = document.getElementById('userEmailPrefix');

            const nombre = inputNombre.value.trim();
            // Convierte todo a minúscula y elimina espacios
            const prefijo = inputPrefijo.value.trim().toLowerCase().replace(/\s+/g, '');

            if (nombre === "" || prefijo === "") {
                alert("Por favor, ingresa tu nombre y la primera parte de tu correo institucional.");
                return;
            }

            // Unimos el texto del usuario con el dominio obligatorio
            const correoCompleto = prefijo + "@juventud.edu.mx";

            // Guardamos la autorización en el celular
            localStorage.setItem('app_isLoggedIn', 'true');
            localStorage.setItem('app_currentUserEmail', correoCompleto);
            localStorage.setItem('name_' + correoCompleto, nombre);

            // Forzamos el salto a la página de Novedades (replace evita que puedan regresar con el botón "Atrás")
            window.location.replace("/Agenda/novedades.html");
        }
    </script>

    <!-- Sigue cargando script.js general para que la PWA siga activa -->
    <script src="/Agenda/script.js"></script>
</body>
</html>
