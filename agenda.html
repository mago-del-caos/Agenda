<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda - Ag lucem</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="/Agenda/styles.css">
    <link rel="manifest" href="/Agenda/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ag lucem">
    <link rel="apple-touch-icon" href="/Agenda/icon-192.png">
</head>
<body>
    <header class="app-header">
        <img src="/Agenda/Ag.png" alt="Ag lucem" class="header-image">
    </header>

    <nav class="app-nav">
        <a href="/Agenda/novedades.html" class="nav-btn">Novedades</a>
        <a href="/Agenda/horario.html" class="nav-btn">Horario</a>
        <a href="/Agenda/agenda.html" class="nav-btn active">Agenda</a>
        <a href="/Agenda/herramientas.html" class="nav-btn">Herramientas</a>
        <a href="/Agenda/comunicacion.html" class="nav-btn">Comunicación</a>
        <a href="/Agenda/redes.html" class="nav-btn">Redes</a>
        <a href="/Agenda/ajustes.html" class="nav-btn">Ajustes</a>
    </nav>

    <main class="app-main">
        <h2 class="section-title">Agenda Personal</h2>
        
        <!-- Botones Superiores -->
        <div style="display: flex; gap: 15px; margin-bottom: 20px;">
            <a href="https://calendar.google.com/" target="_blank" class="app-btn btn-blue" style="flex: 1; padding: 15px; flex-direction: row; font-size: 1rem; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                <span style="font-size: 1.5rem; margin-right: 10px;">📅</span> Agenda Gmail
            </a>
            <!-- Botón para abrir el panel de Alarma Interna -->
            <button id="btnToggleAlarma" class="app-btn btn-yellow" style="flex: 1; padding: 15px; flex-direction: row; font-size: 1rem; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: none; cursor: pointer;">
                <span style="font-size: 1.5rem; margin-right: 10px;">⏰</span> Alarma App
            </button>
        </div>

        <!-- Panel de Alarma Interna (Oculto por defecto) -->
        <div id="panelAlarma" class="card-elevation hidden" style="margin-bottom: 25px; padding: 20px; text-align: center; background: var(--blanco);">
            <h3 style="margin-top: 0; color: var(--ij-azul-fuerte); margin-bottom: 15px;">Programar Alarma</h3>
            
            <input type="time" id="alarmTimeInput" style="padding: 10px; font-size: 1.5rem; border-radius: 8px; border: 1px solid var(--borde); margin-bottom: 15px; font-family: var(--fuente-app); color: var(--texto-oscuro); background: var(--fondo-app);">
            <br>
            
            <!-- Audio oculto de la alarma -->
            <audio id="alarmSound" src="/Agenda/alarma.mp3" preload="auto"></audio>

            <button id="btnSetAlarm" class="app-btn btn-green" style="padding: 12px 20px; font-size: 1rem; width: 100%; max-width: 200px; margin: 0 auto; display: inline-block; flex-direction: row;">
                Activar Alarma
            </button>
            <p id="alarmStatus" style="color: var(--texto-claro); margin-top: 15px; font-weight: bold;"></p>
        </div>

        <!-- Lista de Pendientes Original -->
        <h3 style="font-size: 1.1rem; color: var(--texto-claro); margin-bottom: 10px;">Tus pendientes:</h3>
        <div class="card-elevation">
            <ul id="taskList" class="task-list">
                <!-- Las tareas se inyectan por script.js -->
            </ul>
        </div>
    </main>

    <button id="addTaskBtn" class="fab-button" title="Agregar Nueva Tarea">➕</button>

    <script src="/Agenda/script.js"></script>
</body>
</html>
