<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Compilando 3 marcadores</title>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
<pre id="log">iniciando…</pre>
<script>
var log = document.getElementById('log');
function esc(s) { log.textContent += '\n' + s; }
function cargarImagen(url) {
    return fetch(url).then(function (r) { return r.blob(); }).then(function (b) {
        return new Promise(function (res, rej) {
            var img = new Image();
            img.onload = function () { res(img); };
            img.onerror = function () { rej(new Error('no cargó ' + url)); };
            img.src = URL.createObjectURL(b);
        });
    });
}
window.addEventListener('load', async function () {
    try {
        esc('cargando las tres imágenes del sitio…');
        var adv = await cargarImagen('ar/marcador-adv.jpg');
        esc('adv: ' + adv.width + 'x' + adv.height);
        var smash = await cargarImagen('ar/marcador-smash.jpg');
        esc('smash: ' + smash.width + 'x' + smash.height);
        var piedra = await cargarImagen('ar/marcador-piedra.jpg');
        esc('piedra: ' + piedra.width + 'x' + piedra.height);
        var compiler = new window.MINDAR.IMAGE.Compiler();
        esc('compilando (puede tardar)…');
        var ultimo = -10;
        await compiler.compileImageTargets([adv, smash, piedra], function (p) {
            if (p - ultimo >= 10) { ultimo = p; esc('progreso: ' + p.toFixed(0) + '%'); }
        });
        esc('compilación terminada');
        var buffer = await compiler.exportData();
        esc('bytes del nuevo archivo: ' + buffer.byteLength);
        var verif = new window.MINDAR.IMAGE.Compiler().importData(buffer);
        esc('verificación: ' + verif.length + ' marcadores');
        for (var i = 0; i < verif.length; i++) {
            esc('[' + i + '] ' + verif[i].targetImage.width + 'x' + verif[i].targetImage.height);
        }
        var blob = new Blob([buffer], { type: 'application/octet-stream' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'targets-3.mind';
        document.body.appendChild(a);
        a.click();
        esc('descarga lanzada: targets-3.mind');
        document.title = 'LISTO: ' + buffer.byteLength;
    } catch (e) {
        esc('ERROR: ' + (e && e.message ? e.message : String(e)));
        document.title = 'RESULTADO: ERROR';
    }
});
</script>
</body>
</html>
