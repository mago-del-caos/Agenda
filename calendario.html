        .cal2-celda.sel { background: var(--ij-azul-fuerte); }
        .cal2-celda.sel .cal2-num { color: #fff; }
        .cal2-dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 4px; }
        .cal2-dot { width: 9px; height: 9px; display: block; }
        .cal2-marca { width: 14px; height: 14px; display: block; flex: none; margin-top: 2px; }
        .circulo { border-radius: 50%; }
        .cuadrado { border-radius: 3px; }
        .cal2-chips { display: none; }
        .cal2-recdot { position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--ij-dorado); border: 2px solid #032A60; }
        .cal2-celda.sel .cal2-recdot { border-color: #FFD100; background: #fff; }

        .cal2-evento strong { display: block; font-size: .95rem; }
        .cal2-evento small { color: #7286a3; }
        .cal2-vacio { color: #7286a3; margin: 4px 0; }
        .cal2-recs { margin-top: 14px; border-top: 2px solid #f3e3a1; padding-top: 10px; }
        .cal2-recs h4 { margin: 0 0 8px; color: var(--ij-azul-fuerte); font-size: .98rem; }
        .cal2-rec { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid #eef1f7; }

/* ===== Calendario nativo de la Agenda: eventos oficiales + recordatorios personales ===== */
(function () {
    const CATEGORIAS = { academico: "Académico", pastoral: "Pastoral", oficial: "Oficial", deportivo: "Deportivo", cultural: "Cultural", administrativo: "Administrativo" };
    const porFecha = {};
    OFFICIAL_EVENTS.forEach(function (ev) {
        if (!porFecha[ev.date]) porFecha[ev.date] = [];
        porFecha[ev.date].push(ev);
    });
    function clave(y, m, d) { return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0"); }
    const hoy = new Date();
    const hoyClave = clave(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
    let idx = MONTHS_CONFIG.findIndex(function (c) { return c.year === hoy.getFullYear() && c.month === hoy.getMonth(); });
    if (idx === -1) idx = hoy < new Date(MONTHS_CONFIG[0].year, MONTHS_CONFIG[0].month, 1) ? 0 : MONTHS_CONFIG.length - 1;
    let seleccion = (hoy.getFullYear() === MONTHS_CONFIG[idx].year && hoy.getMonth() === MONTHS_CONFIG[idx].month) ? hoyClave : null;

    // ----- Recordatorios personales: viven en el servidor, atados a la cuenta -----
    const CAL_API = "https://aglucem-api.adrian-camelot32.workers.dev";
    const recPorFecha = {};
    let recActivos = false;
    function tokenSesion() { return localStorage.getItem("aglucem_token") || ""; }
    function cargarRecordatorios() {
        if (!tokenSesion()) return;
        fetch(CAL_API + "/calendario/recordatorios", { headers: { "Authorization": "Bearer " + tokenSesion() } })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
                if (!data || !Array.isArray(data.recordatorios)) return;
                recActivos = true;
                data.recordatorios.forEach(function (rec) {
                    if (!recPorFecha[rec.fecha]) recPorFecha[rec.fecha] = [];
                    recPorFecha[rec.fecha].push(rec);
                });
                render();
            })
            .catch(function () { /* el servidor aún no los activa */ });
    }
    function agregarRecordatorio(texto) {
        fetch(CAL_API + "/calendario/recordatorios", {
            method: "POST",
            headers: { "Authorization": "Bearer " + tokenSesion(), "Content-Type": "application/json" },
            body: JSON.stringify({ fecha: seleccion, texto: texto })
        }).then(function (r) { return r.ok ? r.json() : null; })
          .then(function (data) {
              if (!data || !data.ok) return;
              if (!recPorFecha[seleccion]) recPorFecha[seleccion] = [];
              recPorFecha[seleccion].push({ id: data.id, fecha: seleccion, texto: texto });
              render();
          }).catch(function () {});
    }
    function borrarRecordatorio(rec) {
        fetch(CAL_API + "/calendario/recordatorios/" + rec.id, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + tokenSesion() }
        }).then(function (r) {
            if (!r.ok) return;
            const lista = recPorFecha[rec.fecha] || [];
            const i = lista.indexOf(rec);
            if (i !== -1) lista.splice(i, 1);
            render();
        }).catch(function () {});
    }

    const selMes = document.getElementById("calMes");
    const grid = document.getElementById("calGrid");
    const detalle = document.getElementById("calDetalle");
    const btnPrev = document.getElementById("calPrev");
    const btnNext = document.getElementById("calNext");

    MONTHS_CONFIG.forEach(function (c, i) {
        const op = document.createElement("option");
        op.value = i; op.textContent = c.name + " " + c.year;
        selMes.appendChild(op);
    });

    function renderDetalle() {
        detalle.innerHTML = "";
        if (!seleccion) {
            detalle.innerHTML = '<p class="cal2-vacio">Toca un día para ver sus eventos y tus recordatorios.</p>';
            return;
        }
        const p = seleccion.split("-");
        const fecha = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        const titulo = document.createElement("h3");
        titulo.textContent = fecha.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        detalle.appendChild(titulo);
        const evs = porFecha[seleccion] || [];
        if (!evs.length) {
            const v = document.createElement("p");
            v.className = "cal2-vacio"; v.textContent = "Sin eventos oficiales este día.";
            detalle.appendChild(v);
        }
        evs.forEach(function (ev) {
            const fila = document.createElement("div");
            fila.className = "cal2-evento";
            const marca = document.createElement("span");
            marca.className = "cal2-marca " + (ev.shape === "circle" ? "circulo" : "cuadrado");
            marca.style.background = ev.color;
            const texto = document.createElement("div");
            const t = document.createElement("strong"); t.textContent = ev.title;
            const c = document.createElement("small"); c.textContent = CATEGORIAS[ev.category] || ev.category;
            texto.appendChild(t); texto.appendChild(c);
            fila.appendChild(marca); fila.appendChild(texto);
            detalle.appendChild(fila);
        });

        // --- Mis recordatorios de este día ---
        const sec = document.createElement("div");
        sec.className = "cal2-recs";
        const h = document.createElement("h4");
        h.textContent = "Mis recordatorios";
        sec.appendChild(h);
        const recs = recPorFecha[seleccion] || [];
        if (!recs.length) {
            const v = document.createElement("p");
            v.className = "cal2-vacio"; v.textContent = "No tienes recordatorios este día.";
            sec.appendChild(v);
        }
        recs.forEach(function (rec) {
            const fila = document.createElement("div");
            fila.className = "cal2-rec";
            const punto = document.createElement("span");
            punto.className = "cal2-recdoto";
            const t = document.createElement("span");
            t.className = "cal2-rec-texto"; t.textContent = rec.texto;
            const del = document.createElement("button");
            del.type = "button"; del.className = "cal2-rec-del"; del.textContent = "✕";
            del.setAttribute("aria-label", "Borrar recordatorio");
            del.addEventListener("click", function () { borrarRecordatorio(rec); });
            fila.appendChild(punto); fila.appendChild(t); fila.appendChild(del);
            sec.appendChild(fila);
        });
        if (recActivos) {
            const form = document.createElement("form");
            form.className = "cal2-form";
            const input = document.createElement("input");
            input.type = "text"; input.maxLength = 140;
            input.placeholder = "Escribe tu recordatorio para este día…";
            input.setAttribute("aria-label", "Texto del recordatorio");
            const btn = document.createElement("button");
            btn.type = "submit"; btn.className = "cal2-add"; btn.textContent = "Añadir";
            form.appendChild(input); form.appendChild(btn);
            form.addEventListener("submit", function (e) {
                e.preventDefault();
                const texto = input.value.trim();
                if (texto) agregarRecordatorio(texto);
            });
            sec.appendChild(form);
        } else {
            const nota = document.createElement("p");
            nota.className = "cal2-vacio";
            nota.textContent = "Los recordatorios personales se activan con la próxima actualización del servidor.";
            sec.appendChild(nota);
        }
        detalle.appendChild(sec);
    }

    function render() {
        const cfg = MONTHS_CONFIG[idx];
        selMes.value = idx;
        btnPrev.disabled = idx === 0;
        btnNext.disabled = idx === MONTHS_CONFIG.length - 1;
        grid.innerHTML = "";
        const primerDia = new Date(cfg.year, cfg.month, 1).getDay();
        const diasMes = new Date(cfg.year, cfg.month + 1, 0).getDate();
        for (let b = 0; b < primerDia; b++) {
            const vacia = document.createElement("div");
            vacia.className = "cal2-celda cal2-blank";
            grid.appendChild(vacia);
        }
        for (let d = 1; d <= diasMes; d++) {
            const k = clave(cfg.year, cfg.month, d);
            const celda = document.createElement("button");
            celda.type = "button";
            celda.className = "cal2-celda" + (k === hoyClave ? " hoy" : "") + (k === seleccion ? " sel" : "");
            const num = document.createElement("span");
            num.className = "cal2-num"; num.textContent = d;
            celda.appendChild(num);
            const evs = porFecha[k] || [];
            if (evs.length) {
                const dots = document.createElement("span");
                dots.className = "cal2-dots";
                evs.slice(0, 4).forEach(function (ev) {
                    const dot = document.createElement("span");
                    dot.className = "cal2-dot " + (ev.shape === "circle" ? "circulo" : "cuadrado");
                    dot.style.background = ev.color;
                    dots.appendChild(dot);
                });
                celda.appendChild(dots);
                const chips = document.createElement("span");
                chips.className = "cal2-chips";
                evs.slice(0, 2).forEach(function (ev) {
                    const chip = document.createElement("span");
                    chip.className = "cal2-chip";
                    chip.style.background = ev.color; chip.style.color = ev.textColor || "#000";
                    chip.textContent = ev.title;
                    chips.appendChild(chip);
                });
                if (evs.length > 2) {
                    const mas = document.createElement("span");
                    mas.className = "cal2-mas"; mas.textContent = "+" + (evs.length - 2) + " más";
                    chips.appendChild(mas);
                }
                celda.appendChild(chips);
            }
            if (recPorFecha[k] && recPorFecha[k].length) {
                const rd = document.createElement("span");
                rd.className = "cal2-recdot";
                rd.title = "Tienes recordatorios este día";
                celda.appendChild(rd);
            }
            (function (kk) {
                celda.addEventListener("click", function () { seleccion = kk; render(); });
            })(k);
            grid.appendChild(celda);
        }
        renderDetalle();
    }

    btnPrev.addEventListener("click", function () { if (idx > 0) { idx--; render(); } });
    btnNext.addEventListener("click", function () { if (idx < MONTHS_CONFIG.length - 1) { idx++; render(); } });
    selMes.addEventListener("change", function () { idx = Number(selMes.value); render(); });
    document.getElementById("calHoy").addEventListener("click", function () {
        const i = MONTHS_CONFIG.findIndex(function (c) { return c.year === hoy.getFullYear() && c.month === hoy.getMonth(); });
        if (i !== -1) { idx = i; seleccion = hoyClave; render(); }
    });
    let tx = null;
    grid.addEventListener("touchstart", function (e) { tx = e.changedTouches[0].clientX; }, { passive: true });
    grid.addEventListener("touchend", function (e) {
        if (tx === null) return;
        const dx = e.changedTouches[0].clientX - tx;
        if (dx < -50 && idx < MONTHS_CONFIG.length - 1) { idx++; render(); }
        if (dx > 50 && idx > 0) { idx--; render(); }
        tx = null;
    }, { passive: true });

    const prox = document.getElementById("calProximos");
    const siguientes = OFFICIAL_EVENTS.filter(function (ev) { return ev.date >= hoyClave; }).slice(0, 6);
    if (!siguientes.length) {
        document.getElementById("calProximosSec").style.display = "none";
    } else {
        siguientes.forEach(function (ev) {
            const p = ev.date.split("-");
            const fecha = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
            const fila = document.createElement("button");
            fila.type = "button";
            fila.className = "cal2-prox";
            const marca = document.createElement("span");
            marca.className = "cal2-marca " + (ev.shape === "circle" ? "circulo" : "cuadrado");
            marca.style.background = ev.color;
            const texto = document.createElement("span");
            const f = document.createElement("small");
            f.textContent = fecha.toLocaleDateString("es-MX", { weekday: "short", day: "numeric", month: "short" });
            const t = document.createElement("strong"); t.textContent = ev.title;
            texto.appendChild(f); texto.appendChild(t);
            fila.appendChild(marca); fila.appendChild(texto);
            fila.addEventListener("click", function () {
                const mi = MONTHS_CONFIG.findIndex(function (c) { return c.year === Number(p[0]) && c.month === Number(p[1]) - 1; });
                if (mi !== -1) { idx = mi; seleccion = ev.date; render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
            });
            prox.appendChild(fila);
        });
    }

    const ley = document.getElementById("calLeyenda");
    LEGEND_ITEMS.forEach(function (it) {
        const fila = document.createElement("div");
        fila.className = "cal2-ley";
        const marca = document.createElement("span");
        marca.className = "cal2-marca " + (it.shape === "circle" ? "circulo" : "cuadrado");
        marca.style.background = it.color;
        const t = document.createElement("span"); t.textContent = it.title;
        const f = document.createElement("small"); f.textContent = it.dateHint;
        fila.appendChild(marca); fila.appendChild(t); fila.appendChild(f);
        ley.appendChild(fila);
    });

    render();
    cargarRecordatorios();
})();
    </script>
    <script src="/Agenda/script.js"></script>
</body>
</html>
