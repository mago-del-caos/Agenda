<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Recompilando marcadores</title>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>
<pre id="log">iniciando…</pre>
<script>
var log = document.getElementById('log');
function esc(s) { log.textContent += '\n' + s; }
function cargarImagen(url) {
    return fetch(url).then(function (r) { return r.blob(); }).then(function (b) {
        return new Promise(function (res, rej) {
            var img = new Image();
            img.onload = function () { res(img); };
            img.onerror = function () { rej(new Error('no cargó ' + url)); };
            img.src = URL.createObjectURL(b);
        });
    });
}
window.addEventListener('load', async function () {
    try {
        esc('cargando imágenes del sitio…');
        var imgAdv = await cargarImagen('ar/marcador-adv.jpg');
        esc('adv: ' + imgAdv.width + 'x' + imgAdv.height);
        var imgSmash = await cargarImagen('ar/marcador-smash.jpg');
        esc('smash: ' + imgSmash.width + 'x' + imgSmash.height);
        var compiler = new window.MINDAR.IMAGE.Compiler();
        esc('compilando (puede tardar)…');
        await compiler.compileImageTargets([imgAdv, imgSmash], function (p) {
            esc('progreso: ' + p.toFixed(1) + '%');
        });
        esc('compilación terminada');
        var buffer = await compiler.exportData();
        esc('bytes del nuevo archivo: ' + buffer.byteLength);
        var verif = new window.MINDAR.IMAGE.Compiler().importData(buffer);
        esc('verificación: ' + verif.length + ' marcadores');
        var blob = new Blob([buffer], { type: 'application/octet-stream' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'targets-nuevo.mind';
        document.body.appendChild(a);
        a.click();
        esc('descarga lanzada: targets-nuevo.mind');
        document.title = 'LISTO: ' + buffer.byteLength;
    } catch (e) {
        esc('ERROR: ' + (e && e.message ? e.message : String(e)));
        document.title = 'RESULTADO: ERROR';
    }
});
</script>
</body>
</html>
