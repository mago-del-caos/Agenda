<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Redes - Ag lucem</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Banner de la App (Ocupa todo el ancho) -->
    <header class="app-header">
        <img src="Ag.png" alt="Ag lucem" class="header-image">
    </header>

    <!-- Menú Desplazable -->
    <nav class="app-nav">
        <a href="novedades.html" class="nav-btn">Novedades</a>
        <a href="horario.html" class="nav-btn">Horario</a>
        <a href="agenda.html" class="nav-btn">Agenda</a>
        <a href="herramientas.html" class="nav-btn">Herramientas</a>
        <a href="comunicacion.html" class="nav-btn">Comunicación</a>
        <a href="redes.html" class="nav-btn active">Redes</a>
    </nav>

    <!-- Contenido Principal -->
    <main class="app-main">
        <h2 class="section-title">Juventud TV</h2>
        
        <div class="card-elevation">
            <!-- Reproductor de YouTube adaptado al video especificado -->
            <div class="video-wrapper">
                <iframe 
                    src="https://www.youtube.com/embed/9TLUtY9XnQ8?start=77" 
                    title="Notebook primeros pasos - Juventud TV" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>
            
            <!-- Botón para visitar el canal -->
            <div class="redes-action">
                <a href="https://www.youtube.com/@juventud-2.0" target="_blank" class="app-btn btn-red-yt">
                    <span class="btn-icon">▶️</span>
                    <span class="btn-text">Visitar Canal Oficial</span>
                </a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
