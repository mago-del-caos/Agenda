<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Redes - Ag lucem</title>
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="/Agenda/styles.css">
    <link rel="manifest" href="/Agenda/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ag lucem">
    <link rel="apple-touch-icon" href="/Agenda/icon-192.png">

    <style>
        /* Contenedor estricto para forzar la simetría de todas las imágenes */
        .icon-wrapper {
            width: 90px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        /* La imagen se adaptará al contenedor sin deformarse */
        .img-icon {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0px 6px 6px rgba(0,0,0,0.3));
        }

        /* Forzar que todos los botones tengan la misma altura para alinear el texto */
        .app-btn {
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .btn-yellow { background: linear-gradient(135deg, #FFE047, var(--ij-amarillo, #FFD100)); color: #1E293B !important; }
    </style>
</head>
<body>
    <header class="app-header">
        <img src="/Agenda/Ag.png" alt="Ag lucem" class="header-image">
    </header>

    <nav class="app-nav">
        <a href="/Agenda/novedades.html" class="nav-btn">Novedades</a>
        <a href="/Agenda/horario.html" class="nav-btn">Horario</a>
        <a href="/Agenda/agenda.html" class="nav-btn">Agenda</a>
        <a href="/Agenda/herramientas.html" class="nav-btn">Herramientas</a>
        <a href="/Agenda/comunicacion.html" class="nav-btn">Comunicación</a>
        <a href="/Agenda/redes.html" class="nav-btn active">Redes</a>
        <a href="/Agenda/ajustes.html" class="nav-btn">Ajustes</a>
    </nav>

    <main class="app-main">
        <h2 class="section-title">Comunidad Juventud</h2>
        
        <!-- Video Integrado (Autoplay activado en mute para móviles) -->
        <div class="card-elevation" style="margin-bottom: 25px; overflow: hidden; border-radius: 16px;">
            <div style="position: relative; padding-bottom: 56.25%; height: 0;">
                <iframe src="https://www.youtube.com/embed/fJyjrPgATlg?autoplay=1&mute=1" 
                        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0;" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                </iframe>
            </div>
        </div>

        <div class="button-grid">
            <!-- 1. Facebook -->
            <a href="https://www.facebook.com/InstitutoJuventudMX" target="_blank" class="app-btn btn-blue">
                <div class="icon-wrapper">
                    <img src="/Agenda/facebook.png" alt="Icono Facebook" class="img-icon">
                </div>
                Facebook
            </a>
            
            <!-- 2. Instagram -->
            <a href="https://www.instagram.com/ijem_mx/" target="_blank" class="app-btn btn-magenta">
                <div class="icon-wrapper">
                    <img src="/Agenda/instagram.png" alt="Icono Instagram" class="img-icon">
                </div>
                Instagram
            </a>

            <!-- 3. Juventud TV -->
            <a href="https://www.youtube.com/watch?v=fJyjrPgATlg" target="_blank" class="app-btn btn-yellow">
                <div class="icon-wrapper">
                    <img src="/Agenda/juventudtv.png" alt="Icono Juventud TV" class="img-icon">
                </div>
                Juventud TV
            </a>
        </div>
    </main>

    <script src="/Agenda/script.js"></script>
</body>
</html>
