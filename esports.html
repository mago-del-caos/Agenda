<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- Destructores de caché -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="/Agenda/styles.css">
    <link rel="manifest" href="/Agenda/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>
        .esports-wrap {
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding-bottom: 36px;
        }

        .tourney-card {
            border-radius: 20px;
            padding: 20px 18px;
            background: var(--fondo-app, #FFFFFF);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.14);
        }

        .tourney-head {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
        }

        .tourney-badge {
            font-size: 1.9rem;
            line-height: 1;
        }

        .tourney-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--ij-azul-fuerte);
            margin: 0;
        }

        [data-theme="dark"] .tourney-title { color: var(--ij-celeste); }

        .vs-button {
            display: flex; align-items: center; gap: 14px;
            padding: 16px; border-radius: 20px; text-decoration: none; color: #fff;
            background: linear-gradient(135deg, #7c3aed, #db2777);
            box-shadow: 0 10px 22px rgba(124, 58, 237, 0.35);
        }
        .vs-button:active { filter: brightness(1.15); }
        .vs-button .game-text small { color: rgba(255,255,255,.85); opacity: 1; }
        .vs-logo {
            font-size: 1.6rem; font-weight: 900; font-style: italic; letter-spacing: 1px;
            background: #fff; color: #7c3aed; border-radius: 12px; padding: 8px 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,.3); flex-shrink: 0;
        }

        .esports-grid .img-icon { width: 92px; height: 92px; object-fit: contain; }
        .esports-grid .icon-wrapper { display: flex; align-items: center; justify-content: center; min-height: 96px; margin-bottom: 8px; }
        .btn-tron { background: linear-gradient(160deg, #0b1026, #1b0f2e); border: 2px solid #00e5ff; box-shadow: 0 0 16px rgba(0,229,255,.45); }
        .btn-vs { background: linear-gradient(135deg, #7c3aed, #db2777); }
        .vs-img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
        .vs-big { font-size: 3rem; font-weight: 900; font-style: italic; letter-spacing: 1px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.35); line-height: 1; }

        .game-links { display: flex; flex-direction: column; gap: 10px; }
        .game-link {
            display: flex; align-items: center; gap: 12px;
            padding: 13px 14px; border-radius: 14px; text-decoration: none;
            background: rgba(139, 92, 246, 0.10); color: inherit;
        }
        .game-link:active { background: rgba(139, 92, 246, 0.22); }
        .game-emoji { font-size: 1.7rem; line-height: 1; }
        .game-img { width: 52px; height: 52px; object-fit: cover; border-radius: 12px; flex-shrink: 0; }
        .game-text { flex: 1; display: flex; flex-direction: column; }
        .game-text b { font-size: 1rem; }
        .game-text small { opacity: 0.8; font-size: 0.82rem; }
        .game-arrow { font-size: 1.5rem; font-weight: 800; opacity: 0.55; }

        .tourney-meta {
            font-size: 0.92rem;
            font-weight: 600;
            opacity: 0.85;
            margin: 0 0 14px 0;
        }

        .status-pill {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            padding: 4px 12px;
            border-radius: 999px;
            background: linear-gradient(135deg, #8B5CF6 0%, #4C1D95 100%);
            color: #FFFFFF;
            margin-bottom: 14px;
        }

        .podium {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .podium-slot {
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
            background: rgba(139, 92, 246, 0.10);
        }

        .podium-place {
            display: block;
            font-size: 1.3rem;
            margin-bottom: 4px;
        }

        .podium-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .podium-name {
            display: block;
            font-size: 0.92rem;
            font-weight: 700;
            margin-top: 4px;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        .results-table th,
        .results-table td {
            padding: 8px 10px;
            text-align: left;
        }

        .results-table tbody tr:nth-child(even) {
            background: rgba(3, 42, 96, 0.05);
        }

        .pending {
            opacity: 0.65;
            font-style: italic;
        }

        .winners-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 14px;
            margin-bottom: 16px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
        }
    </style>
</head>
<body>

        <img src="/Agenda/Ag.png" alt="Ag lucem" class="header-image">

    <nav class="app-nav">

        <a href="/Agenda/comunicacion.html" class="nav-btn active">Comunicación</a>
        <a href="/Agenda/redes.html" class="nav-btn">Redes</a>
        <a href="/Agenda/ajustes.html" class="nav-btn">Ajustes</a>
    </nav>

    <main class="app-main">
        <h2 class="section-title">🎮 Esports</h2>

        <div class="esports-wrap">
            <!-- Torneo Juve-Smash Preparatoria -->

                <div class="tourney-head">

                <p class="tourney-meta">Super Smash Bros. Ultimate · Viernes 20 de noviembre de 2026 · Ambos recesos</p>

            <!-- Botones grandes, como en las demás páginas -->

    <script src="/Agenda/script.js"></script>

    <!-- Fuegos artificiales de celebración al entrar -->
    <canvas id="fuegos-artificiales" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:999;"></canvas>
    <script>
    (function () {
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var canvas = document.getElementById("fuegos-artificiales");
        var ctx = canvas.getContext("2d");
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize();
        window.addEventListener("resize", resize);
        var COLORES = ["#FFD100", "#00A8FF", "#D31A52", "#009944", "#8B5CF6", "#FF8A00", "#FFFFFF"];
        var particulas = [], cohetes = [];
        function lanzar() {
            cohetes.push({
                x: canvas.width * (0.15 + Math.random() * 0.7),
                y: canvas.height,
                vy: -(10 + Math.random() * 4),
                objetivo: canvas.height * (0.15 + Math.random() * 0.3),
                color: COLORES[Math.floor(Math.random() * COLORES.length)]
            });
        }
        function explotar(x, y, color) {
            for (var i = 0; i < 70; i++) {
                var a = Math.random() * Math.PI * 2;
                var v = 1 + Math.random() * 4.5;
                particulas.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, vida: 55 + Math.random() * 35, color: Math.random() < 0.3 ? COLORES[Math.floor(Math.random() * COLORES.length)] : color });
            }
        }
        var inicio = Date.now();
        var intervalo = setInterval(lanzar, 380);
        lanzar(); lanzar();
        function paso() {
            var transcurrido = Date.now() - inicio;
            if (transcurrido > 4200) {
                clearInterval(intervalo);
                if (!cohetes.length && !particulas.length) {
                    canvas.remove();
                    window.removeEventListener("resize", resize);
                    return;
                }
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            cohetes = cohetes.filter(function (c) {
                c.y += c.vy;
                ctx.beginPath(); ctx.arc(c.x, c.y, 2.4, 0, Math.PI * 2);
                ctx.fillStyle = c.color; ctx.fill();
                if (c.y <= c.objetivo) { explotar(c.x, c.y, c.color); return false; }
                return true;
            });
            particulas = particulas.filter(function (p) {
                p.x += p.vx; p.y += p.vy; p.vy += 0.045; p.vx *= 0.985; p.vy *= 0.99; p.vida--;
                ctx.globalAlpha = Math.max(p.vida / 80, 0);
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = p.color; ctx.fill();
                ctx.globalAlpha = 1;
                return p.vida > 0;
            });
            requestAnimationFrame(paso);
        }
        requestAnimationFrame(paso);
    })();
    </script>
</body>
